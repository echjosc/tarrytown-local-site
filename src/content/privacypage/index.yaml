body: >-
  This is placeholder text. Replace it with your actual privacy policy
  before launch — ideally reviewed by a lawyer, since this page is not
  legal advice.


  Tarrytown Local ("we," "us," or "our") respects your privacy. This page
  describes what information we collect when you visit our website or sign
  up for our newsletter, and how we use it.


  We may collect basic information you provide directly to us, such as your
  name and email address when you sign up for our newsletter or submit a
  form on this site. We do not sell your personal information to third
  parties.


  If you have any questions about this policy, please contact us using the
  information on our Contact page.
