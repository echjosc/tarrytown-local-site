seoTitle: Privacy Policy
heroTitle: Privacy Policy
lastUpdated: 'January 2026'
body: >-
  Tarrytown Local ("we," "us," or "our") respects your privacy. This page
  describes what information we collect when you visit our website, sign
  up for our newsletter, or contact us, and how we use it.


  Information we collect. We collect information you provide directly to
  us, such as your name and email address when you sign up for our
  newsletter or submit our contact form. We also collect basic usage data
  automatically, such as pages visited and general location, through
  Google Analytics.


  How we use it. We use this information to respond to your inquiries,
  send the newsletter you signed up for, and understand how visitors use
  our site so we can improve it. We do not sell your personal information
  to third parties.


  Third-party services. Our newsletter is managed through Mailchimp,
  contact form submissions are processed through Netlify, our site
  analytics are provided by Google Analytics, and the map on our site is
  provided by Google Maps. Each of these services may collect information
  as described in their own privacy policies.


  Cookies. Our site uses cookies through Google Analytics to understand
  site usage. You can disable cookies through your browser settings at
  any time.


  Your choices. You can unsubscribe from our newsletter at any time using
  the link in any email we send, or contact us to ask us to delete
  information we hold about you.


  Changes to this policy. We may update this policy from time to time.
  The date above reflects the most recent update.


  If you have any questions about this policy, please contact us using the
  information on our Contact page.
