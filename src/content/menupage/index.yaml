seoTitle: Menu | Tarrytown Local
seoDescription: >-
  See what's cooking today at Tarrytown Local. Our restaurant and bakery menus
  change daily based on what's fresh from the farm and market.
heroTitle: Today's Menu
heroSubtitle: Updated fresh every morning based on what's in season.
restaurantMenu:
  heading: Restaurant Menu
  note: >-
    Our menu changes daily depending on what's fresh from the farm — check back
    each morning to see what the chef is cooking.
  display:
    discriminant: file
bakeryMenu:
  heading: Bakery Menu
  note: >-
    Baked fresh every morning with our own milled grains — once it's gone for
    the day, it's gone.
  display:
    discriminant: list
    value:
      - name: Breads
        items:
          - name: Sourdough Loaf
            description: Slow-fermented, milled in-house daily
            price: $8
          - name: Whole Grain Rye
            description: Dense and hearty, made with ancient grains
            price: $9
      - name: Pastries
        items:
          - name: Morning Croissant
            description: Butter-laminated, baked fresh each morning
            price: $5
          - name: Seasonal Fruit Danish
            description: Rotating fruit filling based on what's in season
            price: $6
