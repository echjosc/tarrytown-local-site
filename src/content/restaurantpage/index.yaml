seoTitle: Restaurant in Tarrytown, NY
seoDescription: >-
  Dine-in or take something good to go. Breakfast, lunch, sandwiches, soups,
  salads, and small plates made from the same ingredients we sell in our
  grocery.
hero:
  eyebrow: Restaurant
  headline: Dine-in, or take something good to go.
  description: ''
intro: >-
  Our kitchen starts with the same ingredients we sell in the grocery: local
  produce, fresh-milled grains, grass fed and pasture-raised meats and
  dairy, intentional pantry goods, and whatever showed up from farms we
  know and trust.


  That means the menu changes, because the food is fresh, seasonal, and
  coming from real farms. Tomatoes make an appearance when they can. Greens
  arrive at the mercy of the cold and the heat.


  We cook from there.


  Breakfast, lunch, sandwiches, soups, salads, some small plates. Whatever
  the day, and our ingredients, are asking for.
hours:
  - days: Wednesday – Sunday
    hours: Breakfast & Lunch
